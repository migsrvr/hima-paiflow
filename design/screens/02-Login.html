<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hima · 02 Log in</title>
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#E9EEF2;display:flex;justify-content:center;padding:24px 0}a{color:#1678B5}</style></head>
<body><div style="width:360px;height:800px;overflow:hidden;box-shadow:0 2px 12px rgba(25,53,74,.12)">
<div style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #19354A; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; overflow: hidden">

<main style="flex: 1; display: flex; flex-direction: column; padding: 40px 20px 0">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.2">Welcome back</h1>
<p style="margin: 6px 0 0; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #5D7484">Log in to see what's safe to spend today.</p>
</div>
<img src="../assets/mascot-wave.png" alt="" style="height: 112px; width: auto; flex: none; margin-right: -6px">
</div>

<div style="display: flex; margin-top: 24px; padding: 4px; border-radius: 14px; background: #EDF2F6">
<button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 11px; background: #FFFFFF; color: #19354A; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 15px; font-weight: 700; box-shadow: 0 1px 3px rgba(25, 53, 74, 0.12)">Log in</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 11px; background: transparent; color: #5D7484; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 15px; font-weight: 600">Sign up</button>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px">
<div>
<label for="login-email" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600">Email</label>
<input id="login-email" type="email" autocomplete="email" value="bea.reyes@example.com" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #DFE9F0; border-radius: 14px; background: #FFFFFF; color: #19354A; font-family: Inter, system-ui, sans-serif; font-size: 16px">
</div>
<div>
<label for="login-password" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600">Password</label>
<div style="position: relative">
<input id="login-password" type="password" autocomplete="current-password" value="hima-demo-pass" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 52px 0 16px; border: 1.5px solid #39A9E8; border-radius: 14px; background: #FFFFFF; color: #19354A; font-family: Inter, system-ui, sans-serif; font-size: 16px; box-shadow: 0 0 0 4px rgba(57, 169, 232, 0.18); outline: none">
<button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #5D7484; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<a href="#" style="align-self: flex-end; min-height: 44px; margin-top: -8px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: #1678B5; text-decoration: none">Forgot password?</a>
</form>
</main>

<div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 14px">
<a href="07-Home.html" style="height: 52px; border-radius: 16px; background: #1678B5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Log in</a>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12px; line-height: 1.5; color: #5D7484; text-align: center">New here? Sign up takes about two minutes, then Hima builds your first weekly plan.</p>
</div>
</div>
</div></body></html>
