services:
  - type: web
    name: hima-demo-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /ready
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Public demo limits (0 turns one off) and the testnet wallet top-up threshold.
      - key: RATE_PAYMENTS_PER_USER_DAY
        value: '5'
      - key: RATE_PAYMENTS_PER_IP_DAY
        value: '10'
      - key: RATE_PAYMENTS_PER_DAY
        value: '100'
      - key: RATE_AI_PER_USER_HOUR
        value: '20'
      - key: RATE_AI_PER_IP_HOUR
        value: '40'
      - key: RATE_SIGNIN_PER_IP_HOUR
        value: '10'
      - key: DEMO_TOPUP_BELOW_XLM
        value: '100'
      - key: CORS_ORIGINS
        # The web demo's origin, e.g. https://hima-demo.vercel.app (comma-separated for several).
        sync: false
      - key: STORAGE_BACKEND
        value: postgres
      - key: DATABASE_URL
        # Neon direct PostgreSQL URL (Connection pooling OFF); never commit its value.
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STELLAR_STUDENT_SECRET
        sync: false
      - key: STELLAR_SPONSOR_SECRET
        sync: false
      - key: STELLAR_MERCHANT_PUBLIC_KEY
        sync: false
      - key: STELLAR_SAVINGS_PUBLIC_KEY
        sync: false
      - key: STELLAR_EMERGENCY_PUBLIC_KEY
        sync: false
      - key: PAIFLOW_BASE_URL
        value: https://beta.app.paiflow.xyz
      - key: PAIFLOW_CHECKOUT_ID
        sync: false
      - key: PAIFLOW_CHECKOUT_TOKEN
        sync: false
      - key: PAIFLOW_CHECKOUT_TRIGGER_CONTRACT
        sync: false
      - key: PAIFLOW_CHECKOUT_RECIPIENTS
        sync: false
      - key: PAIFLOW_ALLOWANCE_ID
        sync: false
      - key: PAIFLOW_ALLOWANCE_TOKEN
        sync: false
      - key: PAIFLOW_ALLOWANCE_TRIGGER_CONTRACT
        sync: false
      - key: PAIFLOW_ALLOWANCE_RECIPIENTS
        sync: false
      - key: PAIFLOW_REWARD_ID
        sync: false
      - key: PAIFLOW_REWARD_TOKEN
        sync: false
      - key: PAIFLOW_REWARD_WEBHOOK_SECRET
        sync: false
      - key: PAIFLOW_REWARD_RECIPIENT
        sync: false
